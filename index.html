<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Reserva de Espaços – Clube</title>

  <!-- Responsivo -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Estilo -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Calendário -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>

<header class="hero">
  <div class="overlay">
    <h1>Reserva de Espaços</h1>
    <p>Quiosques e Salão de Festas</p>
  </div>
</header>

<main class="container">

  <!-- IDENTIFICAÇÃO -->
  <section class="card">
    <h2>Identificação</h2>
    <div class="grid-2">
      <input id="nome" placeholder="Nome de Guerra">
      <input id="posto" placeholder="Posto / Graduação">
    </div>
  </section>

  <!-- RESERVA -->
  <section class="card">
    <h2>Reserva</h2>

    <label for="local">Local</label>
    <select id="local">
      <option value="Quiosque Piscina">Quiosque Piscina</option>
      <option value="Quiosque Churrasqueira">Quiosque Churrasqueira</option>
      <option value="Salão de Festas">Salão de Festas</option>
    </select>

    <label for="data">Data</label>
    <input type="text" id="data" placeholder="Selecione a data">

    <label for="turno">Turno</label>
    <select id="turno">
      <option value="">Selecione</option>
      <option value="Manhã">Manhã (09:00–14:00)</option>
      <option value="Tarde">Tarde (16:00–21:00)</option>
      <option value="Dia todo">Dia todo (09:00–21:00)</option>
    </select>

    <button id="btnReservar">Confirmar Reserva</button>

    <!-- Mensagens -->
    <div id="mensagem" class="mensagem"></div>
  </section>

</main>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="js/app.js"></script>

</body>
</html>
